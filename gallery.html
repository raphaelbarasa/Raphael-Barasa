<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Selected portfolio projects and creative work by Raphael Barasa." />
  <title>Selected Work | Raphael Barasa</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <section class="portfolio-gallery" id="gallery" aria-labelledby="gallery-title">
      <div class="portfolio-gallery__container">
        <button class="portfolio-gallery__theme-toggle" type="button" id="galleryThemeToggle" aria-pressed="false" aria-label="Enable dark mode">
          <span aria-hidden="true">◐</span>
          <span class="portfolio-gallery__theme-label">Dark mode</span>
        </button>

        <header class="portfolio-gallery__intro">
          <p class="portfolio-gallery__eyebrow">Selected work</p>
          <h1 class="portfolio-gallery__title" id="gallery-title">A visual feed of recent work.</h1>
          <p class="portfolio-gallery__description">Campaigns, design projects, and behind-the-scenes moments. Filter the work or select a project to view it larger.</p>
        </header>

        <nav class="portfolio-gallery__filters" aria-label="Filter projects">
          <button class="portfolio-gallery__filter" type="button" data-filter="all" aria-pressed="true">All work</button>
          <button class="portfolio-gallery__filter" type="button" data-filter="campaigns" aria-pressed="false">Campaigns</button>
          <button class="portfolio-gallery__filter" type="button" data-filter="design" aria-pressed="false">Design</button>
          <button class="portfolio-gallery__filter" type="button" data-filter="content" aria-pressed="false">Content &amp; SEO</button>
          <button class="portfolio-gallery__filter" type="button" data-filter="behind-scenes" aria-pressed="false">Behind the scenes</button>
        </nav>
        <p class="portfolio-gallery__status" id="galleryStatus" aria-live="polite"></p>

        <div class="portfolio-gallery__grid" id="galleryGrid">
          <button class="portfolio-gallery__tile" type="button" data-category="campaigns" data-caption="Social reel campaign · Wow Pianos · 2026" aria-label="View Social, Wow Pianos, 2026">
            <img src="assets/gallery-1.jpg" alt="Social reel campaign shoot" loading="lazy" decoding="async" />
            <span class="portfolio-gallery__image-fallback" aria-hidden="true">Project image </span>
            <span class="portfolio-gallery__overlay"><span class="portfolio-gallery__caption">Social campaign <small>Campaigns · 2026</small></span><span class="portfolio-gallery__expand" aria-hidden="true">↗</span></span>
          </button>
          <button class="portfolio-gallery__tile" type="button" data-category="content" data-caption="SEO Poster Design · Wow Pianos" aria-label="View Social, Wow Pianos, 2026">
            <img src="assets/gallery-2.jpg" alt="SEO strategy presentation" loading="lazy" decoding="async" />
            <span class="portfolio-gallery__image-fallback" aria-hidden="true">Project image unavailable</span>
            <span class="portfolio-gallery__overlay"><span class="portfolio-gallery__caption">SEO Poster Design <small>Content &amp; SEO</small></span><span class="portfolio-gallery__expand" aria-hidden="true">↗</span></span>
          </button>
          <button class="portfolio-gallery__tile" type="button" data-category="design" data-caption="Brand identity system · Wow Pianos social templates" aria-label="View Brand identity system, Wow Pianos social templates">
            <img src="assets/gallery-3.jpg" alt="Brand identity design" loading="lazy" decoding="async" />
            <span class="portfolio-gallery__image-fallback" aria-hidden="true">Project image unavailable</span>
            <span class="portfolio-gallery__overlay"><span class="portfolio-gallery__caption">Brand identity system <small>Design</small></span><span class="portfolio-gallery__expand" aria-hidden="true">↗</span></span>
          </button>
          <button class="portfolio-gallery__tile" type="button" data-category="design" data-caption="Product photography session · 2023" aria-label="View Product photography session, 2023">
            <img src="assets/gallery-4.jpg" alt="Product photography" loading="lazy" decoding="async" />
            <span class="portfolio-gallery__image-fallback" aria-hidden="true">Project image unavailable</span>
            <span class="portfolio-gallery__overlay"><span class="portfolio-gallery__caption">Product photography <small>Design · 2023</small></span><span class="portfolio-gallery__expand" aria-hidden="true">↗</span></span>
          </button>
          <button class="portfolio-gallery__tile" type="button" data-category="content" data-caption="Reel editing · CapCut timeline" aria-label="View Reel editing, CapCut timeline">
            <img src="assets/gallery-5.jpg" alt="Reel editing workflow" loading="lazy" decoding="async" />
            <span class="portfolio-gallery__image-fallback" aria-hidden="true">Project image unavailable</span>
            <span class="portfolio-gallery__overlay"><span class="portfolio-gallery__caption">Reel editing <small>Content &amp; SEO</small></span><span class="portfolio-gallery__expand" aria-hidden="true">↗</span></span>
          </button>
          <button class="portfolio-gallery__tile" type="button" data-category="campaigns" data-caption="Campaign moodboard · Q3 2024" aria-label="View Campaign moodboard, Q3 2024">
            <img src="assets/gallery-6.jpg" alt="Campaign moodboard" loading="lazy" decoding="async" />
            <span class="portfolio-gallery__image-fallback" aria-hidden="true">Project image unavailable</span>
            <span class="portfolio-gallery__overlay"><span class="portfolio-gallery__caption">Campaign moodboard <small>Campaigns · 2024</small></span><span class="portfolio-gallery__expand" aria-hidden="true">↗</span></span>
          </button>
          <button class="portfolio-gallery__tile" type="button" data-category="design" data-caption="Logo exploration · iteration board" aria-label="View Logo exploration, iteration board">
            <img src="assets/gallery-7.jpg" alt="Logo design exploration" loading="lazy" decoding="async" />
            <span class="portfolio-gallery__image-fallback" aria-hidden="true">Project image unavailable</span>
            <span class="portfolio-gallery__overlay"><span class="portfolio-gallery__caption">Logo exploration <small>Design</small></span><span class="portfolio-gallery__expand" aria-hidden="true">↗</span></span>
          </button>
          <button class="portfolio-gallery__tile" type="button" data-category="content" data-caption="Analytics dashboard review · SEO monitoring" aria-label="View Analytics dashboard review, SEO monitoring">
            <img src="assets/gallery-8.jpg" alt="Analytics dashboard" loading="lazy" decoding="async" />
            <span class="portfolio-gallery__image-fallback" aria-hidden="true">Project image unavailable</span>
            <span class="portfolio-gallery__overlay"><span class="portfolio-gallery__caption">Analytics dashboard review <small>Content &amp; SEO</small></span><span class="portfolio-gallery__expand" aria-hidden="true">↗</span></span>
          </button>
          <button class="portfolio-gallery__tile" type="button" data-category="campaigns" data-caption="Showroom promo shoot · Wow Pianos Karen" aria-label="View Showroom promo shoot, Wow Pianos Karen">
            <img src="assets/gallery-9.jpg" alt="Showroom promotional shoot" loading="lazy" decoding="async" />
            <span class="portfolio-gallery__image-fallback" aria-hidden="true">Project image unavailable</span>
            <span class="portfolio-gallery__overlay"><span class="portfolio-gallery__caption">Showroom promo shoot <small>Campaigns</small></span><span class="portfolio-gallery__expand" aria-hidden="true">↗</span></span>
          </button>
          <button class="portfolio-gallery__tile" type="button" data-category="content" data-caption="Content calendar · planning session" aria-label="View Content calendar, planning session">
            <img src="assets/gallery-10.jpg" alt="Content calendar planning" loading="lazy" decoding="async" />
            <span class="portfolio-gallery__image-fallback" aria-hidden="true">Project image unavailable</span>
            <span class="portfolio-gallery__overlay"><span class="portfolio-gallery__caption">Content calendar <small>Content &amp; SEO</small></span><span class="portfolio-gallery__expand" aria-hidden="true">↗</span></span>
          </button>
          <button class="portfolio-gallery__tile" type="button" data-category="design" data-caption="Story design · Instagram templates" aria-label="View Story design, Instagram templates">
            <img src="assets/gallery-11.jpg" alt="Instagram story templates" loading="lazy" decoding="async" />
            <span class="portfolio-gallery__image-fallback" aria-hidden="true">Project image unavailable</span>
            <span class="portfolio-gallery__overlay"><span class="portfolio-gallery__caption">Story design <small>Design</small></span><span class="portfolio-gallery__expand" aria-hidden="true">↗</span></span>
          </button>
          <button class="portfolio-gallery__tile" type="button" data-category="behind-scenes" data-caption="Team collaboration · content review" aria-label="View Team collaboration, content review">
            <img src="assets/gallery-12.jpg" alt="Team content review" loading="lazy" decoding="async" />
            <span class="portfolio-gallery__image-fallback" aria-hidden="true">Project image unavailable</span>
            <span class="portfolio-gallery__overlay"><span class="portfolio-gallery__caption">Team collaboration <small>Behind the scenes</small></span><span class="portfolio-gallery__expand" aria-hidden="true">↗</span></span>
          </button>
        </div>

        <footer class="portfolio-gallery__footer">
          <p>More about this work:</p>
          <a class="portfolio-gallery__link" href="https://www.raphaelbarasa.online/">Back to Home Page <span aria-hidden="true">↗</span></a>
        </footer>
      </div>

      <div class="portfolio-gallery__lightbox" id="galleryLightbox" role="dialog" aria-modal="true" aria-label="Project image viewer" aria-describedby="galleryLightboxCaption" tabindex="-1" hidden>
        <button class="portfolio-gallery__lightbox-close" type="button" id="galleryLightboxClose" aria-label="Close image viewer">×</button>
        <button class="portfolio-gallery__lightbox-nav portfolio-gallery__lightbox-prev" type="button" id="galleryLightboxPrev" aria-label="Previous project">‹</button>
        <figure class="portfolio-gallery__lightbox-figure">
          <img class="portfolio-gallery__lightbox-image" id="galleryLightboxImage" src="" alt="" />
          <p class="portfolio-gallery__lightbox-fallback" id="galleryLightboxFallback" hidden>Project image unavailable</p>
          <figcaption id="galleryLightboxCaption"></figcaption>
        </figure>
        <button class="portfolio-gallery__lightbox-nav portfolio-gallery__lightbox-next" type="button" id="galleryLightboxNext" aria-label="Next project">›</button>
      </div>
    </section>
  </main>
  <script src="script.js" defer></script>
</body>
</html>
